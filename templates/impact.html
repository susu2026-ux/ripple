<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Impact | Ripple</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

    <main class="impact-container">

        <a href="/project/{{ project['id'] }}" class="back-link">
            ← Back to Project
        </a>

        <section class="impact-header">
            <p class="project-label">MEASURE YOUR IMPACT</p>
            <h1>Record Impact</h1>
            <p>
                Add the measurable results created by
                {{ project["title"] }}.
            </p>
        </section>

        <form
            action="/project/{{ project['id'] }}/impact"
            method="post"
            class="impact-form"
        >

            <div class="form-group">
                <label for="volunteer_hours">Volunteer Hours</label>
                <input
                    type="number"
                    id="volunteer_hours"
                    name="volunteer_hours"
                    min="0"
                    step="0.5"
                    placeholder="e.g. 12.5"
                    required
                >
            </div>

            <div class="form-group">
                <label for="people_reached">People Reached</label>
                <input
                    type="number"
                    id="people_reached"
                    name="people_reached"
                    min="0"
                    placeholder="e.g. 50"
                    required
                >
            </div>

            <button type="submit" class="primary-button">
                Save Impact
            </button>

        </form>

    </main>

</body>
</html>
